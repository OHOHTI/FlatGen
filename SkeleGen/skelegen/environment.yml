# Environment used to generate flatband_sym_1M (versions exported from the
# original run environment).
# Note: torch-scatter wheels must match your torch/CUDA build — if you install
# a different torch, change the find-links line accordingly (https://data.pyg.org/whl/).
name: skelegen
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - torch==2.7.1
      - --find-links https://data.pyg.org/whl/torch-2.7.1+cu126.html
      - torch-scatter==2.1.2
      - torch-geometric==2.7.0
      - pytorch-lightning==2.6.1
      - torchmetrics==1.8.2
      - hydra-core==1.3.2
      - omegaconf==2.3.0
      - python-dotenv==1.2.1
      - einops==0.8.2
      - numpy==2.3.5
      - scipy==1.17.0
      - pandas==3.0.0
      - matplotlib==3.10.8
      - scikit-learn==1.8.0
      - tqdm==4.67.3
      - pymatgen==2025.10.7
      - pyxtal==1.1.2
      - ase==3.27.0
      - spglib==2.7.0
      - smact==3.2.0
      - e3nn==0.5.9
      - transformers==5.3.0
      - jarvis-tools==2026.1.10
      - periodictable==2.0.2
      - imageio==2.37.2
      - wandb==0.24.2
